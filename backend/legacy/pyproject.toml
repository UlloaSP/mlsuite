# The frozen environment for bundles written before mlbundle 0.3 (format 1, without pylock.toml).
# Their state loads only with the mlbundle and scikit-learn that wrote it, so nothing here may
# change: the constraints are the exact versions MLsuite ran these bundles with.
[project]
name = "mlsuite-legacy-environment"
version = "1.0.0"
requires-python = "==3.14.*"
dependencies = [
    "mlbundle[sklearn,xgboost,catboost,onnx]==0.2.1",
    "scikit-learn==1.9.1",
    "pandas==3.0.6",
]

[tool.uv]
package = false
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
