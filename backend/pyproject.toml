[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "ML Suite Backend API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120.3",
    "uvicorn[standard]>=0.38.0",
    "pandas>=3.0.3,<4.0.0",
    # A bundle's skops state loads only with the scikit-learn version that wrote it.
    "scikit-learn==1.9.1",
    "mlbundle[sklearn,xgboost,catboost,onnx]==0.1.0a3",
    "python-multipart>=0.0.31",
    "crystal-tree",
    "xclingo==2.0b12",
]

[project.optional-dependencies]
dev = ["httpx>=0.28.1", "pytest>=8.4.1", "mlbundle[schema]==0.1.0a3"]

[tool.uv.sources]
# The explanation adapter uses crystal-tree 0.2 APIs; migrate it before updating this rev.
crystal-tree = { git = "https://github.com/bramucas/crystal-tree.git", rev = "ec92d54163246dca94bb8076866ce4734885b128" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
