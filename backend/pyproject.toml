[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "MLsuite backend runtime"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120.3",
    "uvicorn[standard]>=0.38.0",
    "pandas>=3.0.3,<4.0.0",
    # Reads uploads and locks without model libraries; models load in their own environments.
    "mlbundle==0.3.1",
    "python-multipart>=0.0.31",
    "crystal-tree",
    "dafact==0.5",
    "xclingo==2.0b24",
]

[project.optional-dependencies]
# Tests export bundles with every library mlbundle supports and run them in this interpreter.
dev = ["httpx>=0.28.1", "pytest>=8.4.1", "mlbundle[all]==0.3.1"]

[tool.uv.sources]
crystal-tree = { git = "https://github.com/bramucas/crystal-tree.git", rev = "0d4b5078040fbf05cbe602f82d6e93f221050d4d" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
