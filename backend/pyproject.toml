[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "ML Suite Backend API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120.3",
    "uvicorn[standard]>=0.38.0",
    "joblib>=1.5.2",
    "pandas>=3.0.3,<4.0.0",
    "scikit-learn>=1.7.2",
    "mlschema==0.2.1",
    "python-multipart>=0.0.31",
    "crystal-tree",
    "xclingo==2.0b12",
    "xgboost>=3.2.0",
    "onnxruntime>=1.30.0",
    "onnx>=1.23.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28.1", "pytest>=8.4.1"]

[tool.uv.sources]
# The explanation adapter uses crystal-tree 0.2 APIs; migrate it before updating this rev.
crystal-tree = { git = "https://github.com/bramucas/crystal-tree.git", rev = "ec92d54163246dca94bb8076866ce4734885b128" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
