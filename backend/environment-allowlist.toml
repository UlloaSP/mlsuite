# What MLsuite installs to run an uploaded model, reviewed in pull requests.
#
# A bundle's pylock.toml pins every distribution its model needs, and the environment always holds
# exactly those versions. This list decides which locks MLsuite agrees to install: the Python
# version and the mlbundle release are named exactly, and every locked package (the model's
# libraries and all their dependencies) must be named below, at a version inside its range.
# Pre-releases are never installed.
#
# Before installing, the builder also checks each locked release on the package index: it must
# have been published at least RUNTIME_PACKAGE_MIN_AGE_DAYS ago (7 by default), not be yanked,
# and have no known vulnerability. Then the model is loaded and predicts its samples on this host,
# so a wheel this CPU cannot run (shelob's CPUs lack AVX: SIGILL) fails while it is prepared,
# before anyone predicts with it.
#
# Ranges follow what a package's compiled code and data formats may change. Packages with native
# code or that shape predictions are held to the major line the corpus validated; pure-Python
# packages need only a lower bound. The manual allowlist:corpus and allowlist:shelob GitLab jobs
# (deploy/allowlist-matrix) export every model family at both ends of the scikit-learn range and
# check their predictions on shelob; run them when a range widens to a new major line.

python = [
    "3.14.0", "3.14.1", "3.14.2", "3.14.3", "3.14.4",
    "3.14.5", "3.14.6", "3.14.7", "3.14.8", "3.14.9",
]

# Each release's py3-none-any wheel digest: the lock omits mlbundle, so the builder installs it
# by this hash.
[mlbundle]
"0.3.0" = "1d4c6fcca08a6e0a13c2df98ff29b55a1d20f12d3a84cdea7f7b8bea1c62ee63"
"0.3.1" = "bbac96068763273505f6356c7144706d61b9c4a17886707772568a3a62cb9c25"

# Validated on shelob with scikit-learn 1.7.2 to 1.9.1, XGBoost, CatBoost and ONNX models and
# pipelines exported with mlbundle 0.3.0 and 0.3.1 on CPython 3.14.7: every model predicted what it
# predicted where it was trained, bit for bit, or within the last digits of a float for MLP, naive
# Bayes, SGD (float64) and ONNX (float32), whose sums take another order on a CPU without AVX.
[packages]
# Native code, or what the model's state and predictions depend on: the validated major line.
catboost = ">=1.2,<2"
contourpy = ">=1.3,<2"
fonttools = ">=4.50,<5"
kiwisolver = ">=1.4,<2"
matplotlib = ">=3.9,<4"
ml-dtypes = ">=0.5,<1"
numpy = ">=2.0,<3"
nvidia-nccl-cu13 = ">=2.27,<3"
onnx = ">=1.17,<2"
onnxruntime = ">=1.20,<2"
pandas = ">=3.0,<4"
pillow = ">=13.0,<14"
protobuf = ">=7.0,<8"
pydantic = ">=2.10,<3"
pydantic-core = ">=2.27,<3"
scikit-learn = ">=1.7.2,<2"
scipy = ">=1.14,<2"
skops = ">=0.16,<1"
xgboost = ">=3.0,<4"

# Pure Python: any release from the lower bound on.
annotated-types = ">=0.7"
cloudpickle = ">=3.0"
cycler = ">=0.12"
flatbuffers = ">=24.3"
graphviz = ">=0.20"
joblib = ">=1.4"
narwhals = ">=2.0"
packaging = ">=24.0"
plotly = ">=6.0"
prettytable = ">=3.10"
pyparsing = ">=3.1"
python-dateutil = ">=2.9"
six = ">=1.16"
threadpoolctl = ">=3.5"
typing-extensions = ">=4.12"
typing-inspection = ">=0.4"
tzdata = ">=2024.1"
wcwidth = ">=0.2.13"
