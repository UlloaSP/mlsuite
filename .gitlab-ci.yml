workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - when: never

stages:
  - test
  - validate
  - deploy

secrets:
  stage: test
  image: python:3.14-alpine
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
  script:
    - python -m unittest discover -s .github/tests -p test_secret_scan.py
    - |
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}"
      git cat-file -e "$base^{commit}" 2>/dev/null || base=
      python .github/scripts/scan-secrets.py --base "$base" --head "$CI_COMMIT_SHA"

frontend:
  stage: test
  image: node:26-alpine
  before_script:
    - cd frontend
    - npm install --global vite-plus@1.3.0
    - vp install --frozen-lockfile
  script:
    - NODE_OPTIONS=--no-webstorage ./node_modules/.bin/vp test --run
    - ./node_modules/.bin/vp run build

api:
  stage: test
  image: maven:3.9.16-eclipse-temurin-25
  script:
    - cd api
    - mvn -B -ntp verify
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: api/target/surefire-reports/*.xml

python:
  stage: test
  image: ghcr.io/astral-sh/uv:0.12.17-python3.14-trixie-slim
  parallel:
    matrix:
      - COMPONENT:
          - backend
          - ops-agent
  before_script:
    - apt-get update && apt-get install --yes --no-install-recommends git
  script:
    - cd "$COMPONENT"
    - uv sync --locked --extra dev
    - uv run --locked --extra dev pytest tests --junitxml=test-results.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: $COMPONENT/test-results.xml

configuration:
  stage: validate
  image: docker:29.7.2-cli
  before_script:
    - apk add --no-cache curl git python3 tar
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = merge_request_event ] &&
         [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" = main ] &&
         { [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != develop ] ||
           [ "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" != "$CI_PROJECT_ID" ]; }; then
        echo 'Promote to main through a merge request from this project develop branch.' >&2
        exit 1
      fi
    - |
      if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
        echo 'Private environment files must not be tracked.' >&2
        exit 1
      fi
    - docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml --profile operations config --quiet
    - python3 deploy/test_compose_parity.py
    - python3 -m unittest discover -s .github/tests -p 'test_release_*.py'
    - |
      curl -fsSL -o /tmp/actionlint.tar.gz \
        https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
      echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum -c -
      tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      /tmp/actionlint

.shelob:
  stage: deploy
  image: alpine:3.24
  resource_group: shelob-development
  interruptible: false
  before_script:
    - apk add --no-cache openssh-client tar
    - chmod 400 "$DEPLOY_SSH_PRIVATE_KEY"
    - |
      shelob() {
        ssh -i "$DEPLOY_SSH_PRIVATE_KEY" \
          -o BatchMode=yes \
          -o ConnectTimeout=10 \
          -o ServerAliveInterval=30 \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=yes \
          -o UserKnownHostsFile="$DEPLOY_SSH_KNOWN_HOSTS" \
          pablo.ulloa@10.56.35.200 "$@"
      }

deploy:shelob:
  extends: .shelob
  needs:
    - secrets
    - frontend
    - api
    - python
    - configuration
  environment:
    name: shelob
  # It waits for the release and backs up before it deploys.
  timeout: 2h
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - when: never
  script:
    - |
      shelob bash -s -- "$CI_COMMIT_SHA" <<'REMOTE'
      set -euo pipefail
      cd /home/pablo.ulloa/mlsuite
      test -f .env
      test -z "$(git status --porcelain)"
      export GIT_SSH_COMMAND='ssh -i ~/.ssh/mlsuite_gitlab_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
      git fetch gitlab main
      test "$(git rev-parse FETCH_HEAD)" = "$1" || {
        echo 'GitLab main does not contain the pipeline commit.' >&2
        exit 1
      }
      git switch main
      previous=$(git rev-parse HEAD)
      git merge --ff-only "$1"
      test "$(git rev-parse HEAD)" = "$1"
      bash scripts/deploy-release.sh "$1" "$previous"
      REMOTE

# Run these two on develop before promoting a change to backend/environment-allowlist.toml: the
# corpus comes from a machine like the one models are trained on, and is proved on shelob's CPUs.
allowlist:corpus:
  stage: validate
  image: ghcr.io/astral-sh/uv:0.13.5-python3.14-trixie-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - when: never
  script:
    - python deploy/allowlist-matrix/export_corpus.py corpus
  artifacts:
    expire_in: 7 days
    paths:
      - corpus/corpus.json
      - corpus/bundles/

allowlist:shelob:
  extends: .shelob
  needs:
    - allowlist:corpus
  environment:
    name: shelob
    action: access
  timeout: 3h
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
    - when: never
  script:
    - |
      tar -cf - backend deploy/allowlist-matrix corpus | shelob '
        set -eu
        work=$(mktemp -d)
        trap "rm -rf \"$work\"" EXIT
        tar -xf - -C "$work"
        bash "$work/deploy/allowlist-matrix/run-matrix.sh" "$work/corpus" "$work/backend"
      '
