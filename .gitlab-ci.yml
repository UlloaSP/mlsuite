workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - when: never

stages:
  - test
  - validate
  - deploy

secrets:
  stage: test
  image: python:3.14-alpine
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
  script:
    - python -m unittest discover -s .github/tests -p test_secret_scan.py
    - python .github/scripts/scan-secrets.py --base "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_COMMIT_BEFORE_SHA}" --head "$CI_COMMIT_SHA"

frontend:
  stage: test
  image: node:25-alpine
  before_script:
    - cd frontend
    - npm install --global vite-plus@0.2.5
    - vp install --frozen-lockfile
  script:
    - NODE_OPTIONS=--no-webstorage vp test --run
    - vp run build

api:
  stage: test
  image: maven:3.9.11-eclipse-temurin-25
  script:
    - cd api
    - mvn -B -ntp verify
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: api/target/surefire-reports/*.xml

python:
  stage: test
  image: ghcr.io/astral-sh/uv:0.9.25-python3.14-bookworm-slim
  parallel:
    matrix:
      - COMPONENT:
          - backend
          - ops-agent
  before_script:
    - apt-get update && apt-get install --yes --no-install-recommends git
  script:
    - cd "$COMPONENT"
    - uv sync --locked --extra dev
    - uv run --locked --extra dev pytest tests --junitxml=test-results.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: $COMPONENT/test-results.xml

configuration:
  stage: validate
  image: docker:27.5.1-cli
  before_script:
    - apk add --no-cache curl git python3 tar
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = merge_request_event ] &&
         [ "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" = main ] &&
         { [ "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" != develop ] ||
           [ "$CI_MERGE_REQUEST_SOURCE_PROJECT_ID" != "$CI_PROJECT_ID" ]; }; then
        echo 'Promote to main through a merge request from this project develop branch.' >&2
        exit 1
      fi
    - |
      if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
        echo 'Private environment files must not be tracked.' >&2
        exit 1
      fi
    - docker compose --env-file .env.example -f docker-compose.dev.yml config --quiet
    - docker compose --env-file .env.example -f docker-compose.prod.yml config --quiet
    - python3 -m unittest discover -s .github/tests -p 'test_release_*.py'
    - |
      curl -fsSL -o /tmp/actionlint.tar.gz \
        https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
      echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum -c -
      tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
      /tmp/actionlint

deploy:shelob:
  stage: deploy
  image: alpine:3.21
  needs:
    - secrets
    - frontend
    - api
    - python
    - configuration
  resource_group: shelob-development
  interruptible: false
  environment:
    name: shelob
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - when: never
  before_script:
    - apk add --no-cache openssh-client
    - chmod 400 "$DEPLOY_SSH_PRIVATE_KEY"
  script:
    - |
      ssh -i "$DEPLOY_SSH_PRIVATE_KEY" \
        -o BatchMode=yes \
        -o ConnectTimeout=10 \
        -o IdentitiesOnly=yes \
        -o StrictHostKeyChecking=yes \
        -o UserKnownHostsFile="$DEPLOY_SSH_KNOWN_HOSTS" \
        pablo.ulloa@10.56.35.200 bash -s -- "$CI_COMMIT_SHA" <<'REMOTE'
      set -euo pipefail
      cd /home/pablo.ulloa/mlsuite
      test -f .env
      test -z "$(git status --porcelain)"
      git fetch origin main
      test "$(git rev-parse origin/main)" = "$1" || {
        echo 'GitHub main does not contain the GitLab pipeline commit.' >&2
        exit 1
      }
      git switch main
      git merge --ff-only "$1"
      test "$(git rev-parse HEAD)" = "$1"
      docker compose --env-file .env -f docker-compose.dev.yml up -d --build

      web_port=$(sed -n 's/^WEB_PORT=//p' .env | tail -n 1)
      case "$web_port" in ''|*[!0-9]*) echo 'Invalid WEB_PORT in .env' >&2; exit 1;; esac
      for _ in $(seq 1 60); do
        if curl -fsS --max-time 5 "http://127.0.0.1:${web_port}/api/readiness" |
          python3 -c 'import json,sys; raise SystemExit(json.load(sys.stdin).get("ready") is not True)' 2>/dev/null; then
          exit 0
        fi
        sleep 5
      done
      docker compose --env-file .env -f docker-compose.dev.yml ps
      echo 'Deployment did not become ready within five minutes.' >&2
      exit 1
      REMOTE
