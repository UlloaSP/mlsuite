########################
# application.properties – Configuración global para producción
########################

analyzer.url=${ANALYZER_BASE_URL}
runtime-builder.url=${RUNTIME_BUILDER_BASE_URL}
storage.endpoint=${STORAGE_ENDPOINT}
storage.access-key=${STORAGE_ACCESS_KEY}
storage.secret-key=${STORAGE_SECRET_KEY}
storage.bucket=${STORAGE_BUCKET}
storage.auto-create-bucket=${STORAGE_AUTO_CREATE_BUCKET}
storage.deletion.enabled=${STORAGE_DELETION_ENABLED:true}
storage.deletion.delay-ms=${STORAGE_DELETION_DELAY_MS:30000}
storage.deletion.max-attempts=${STORAGE_DELETION_MAX_ATTEMPTS:10}
storage.deletion.batch-size=${STORAGE_DELETION_BATCH_SIZE:20}
storage.deletion.stale-after-seconds=${STORAGE_DELETION_STALE_AFTER_SECONDS:300}
storage.deletion.retention-days=${STORAGE_DELETION_RETENTION_DAYS:7}
storage.deletion.retention-batch-size=1000
artifact.orphan-grace-seconds=${ARTIFACT_ORPHAN_GRACE_SECONDS:86400}
cors.allow-origins=${CORS_ALLOW_ORIGINS}

# Nombre de la aplicación, usado en logs y discovery
spring.application.name=mlsuite
# Preserve the existing JSON tree, timestamp and WebSocket payload contracts.
spring.http.converters.preferred-json-mapper=jackson2
spring.websocket.messaging.preferred-json-mapper=jackson2
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Perfil activo (entorno de ejecución)
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

########################
# SQL
########################

# Deshabilita ejecución de scripts SQL explícitos en prod
spring.sql.init.mode=never

# Flyway is the only schema owner, from an empty database onwards.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.postgresql.transactional-lock=false
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
spring.flyway.connect-retries=10
spring.flyway.user=${DB_MIGRATION_USER:${DB_USER}}
spring.flyway.password=${DB_MIGRATION_PASS:${DB_PASS}}

########################
# Logging / SQL
########################

# Nivel de logging para sentencias SQL de Hibernate
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security: INFO

# Ruta y nombre de fichero de logs
logging.file.name=${LOG_PATH}/mlsuite.log

# Formato de salida por consola
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Formato de salida en fichero
logging.pattern.file=%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n

########################
# Data Source / HikariCP
########################

# Driver JDBC para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# URL de conexión, con variables de entorno para host, puerto y base de datos
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_PROD}

# Credenciales de base de datos
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Pool de conexiones HikariCP – tamaño máximo de conexiones activas
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}

# Pool de conexiones HikariCP – número mínimo de conexiones inactivas
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# Pool de conexiones HikariCP – tiempo máximo de inactividad antes de cerrar conexión (ms)
spring.datasource.hikari.idle-timeout=300000

# Pool de conexiones HikariCP – tiempo de espera para obtener conexión (ms)
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
model.mutations.require-version=${MODEL_MUTATIONS_REQUIRE_VERSION:false}

# Pool de conexiones HikariCP – vida máxima de una conexión antes de renovarla (ms)
spring.datasource.hikari.max-lifetime=1800000

# Pool de conexiones HikariCP – tiempo de validación de conexiones (ms)
spring.datasource.hikari.validation-timeout=5000

# Pool de conexiones HikariCP – detección de fugas de conexión (ms)
spring.datasource.hikari.leak-detection-threshold=120000

# SQL de inicialización de conexión, útil para validar antes de usar
spring.datasource.hikari.connection-init-sql=SELECT 1


########################
# JPA / Hibernate
########################

# Política de validación de esquema (validate|update|create|create-drop)
spring.jpa.hibernate.ddl-auto=validate

# Mostrar o no SQL en logs
spring.jpa.show-sql=false

# Deshabilitar formato de SQL en logs
spring.jpa.properties.hibernate.format_sql=false

# Deshabilitar comentarios SQL en logs
spring.jpa.properties.hibernate.use_sql_comments=false

# Zona horaria JDBC para evitar discrepancias de fecha/hora
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

########################
# Transacciones
########################

# Tiempo de espera por defecto para transacciones
spring.transaction.default-timeout=30s

# Habilitar rollback si la confirmación falla
spring.transaction.rollback-on-commit-failure=true

###################
# Seguridad
###################

server.port=${SPRING_PORT}

mlsuite.superadmin.email=${MLSUITE_SUPERADMIN_EMAIL:}
mlsuite.superadmin.password=${MLSUITE_SUPERADMIN_PASSWORD:}
mlsuite.superadmin.full-name=${MLSUITE_SUPERADMIN_FULL_NAME:}
mlsuite.superadmin.username=${MLSUITE_SUPERADMIN_USERNAME:}

# The session cookie is sent only over HTTPS unless SESSION_COOKIE_SECURE=false. Browsers accept a
# Secure cookie from http://localhost, so only plain HTTP on another address needs false.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Configuración de SameSite para cookies de sesión
server.servlet.session.cookie.same-site=LAX

# A model bundle can be at most 512 MB, the largest archive the runtime reads (mlbundle's cap);
# nginx accepts the same plus the form's few fields. Uploads are kept on disk while they are read.
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=513MB

# Public bookmarks: the largest model artifact a publicly runnable bookmark may bind, how many
# public runs may use the shared runtime at once (more wait their turn), and how many runs of one
# bookmark a network without a session, or an account, may make in 24 hours.
mlsuite.public-prediction.max-model-size-mb=${PUBLIC_PREDICTION_MAX_MODEL_SIZE_MB:50}
mlsuite.public-prediction.max-concurrent=${PUBLIC_PREDICTION_MAX_CONCURRENT:2}
mlsuite.public-prediction.anonymous-runs-per-day=${PUBLIC_PREDICTION_ANONYMOUS_RUNS_PER_DAY:50}
mlsuite.public-prediction.signed-in-runs-per-day=${PUBLIC_PREDICTION_SIGNED_IN_RUNS_PER_DAY:500}

# Workspace members: how many of their predictions, explanations and artifact inspections may
# use the shared runtime at once, apart from public pages and API clients; more wait their turn.
mlsuite.workspace-prediction.max-concurrent=${WORKSPACE_PREDICTION_MAX_CONCURRENT:4}
# Bulk uploads run on the server as jobs (prediction_job): their size, how many may be open at once
# in an organization and per member, the rows run per chunk, and how long a worker's claim lasts.
mlsuite.prediction-jobs.max-rows=${PREDICTION_JOBS_MAX_ROWS:10000}
mlsuite.prediction-jobs.max-open-per-organization=${PREDICTION_JOBS_MAX_OPEN_PER_ORGANIZATION:4}
mlsuite.prediction-jobs.max-open-per-member=${PREDICTION_JOBS_MAX_OPEN_PER_MEMBER:2}
mlsuite.prediction-jobs.chunk-rows=100
mlsuite.prediction-jobs.lease-seconds=120
mlsuite.prediction-jobs.poll-ms=1000
# A purge deletes this many rows of a table in each transaction.
mlsuite.purge.batch-size=${PURGE_BATCH_SIZE:1000}
mlsuite.purge.lease-seconds=120
mlsuite.purge.poll-ms=2000
# Uploaded models are prepared on the server (ModelPreparationWorker): their environment is built
# and the model loaded there. A claim lasts longer than the slowest build; a failure is tried
# again after a delay that doubles each time, up to this many attempts.
mlsuite.model-preparation.lease-seconds=1800
mlsuite.model-preparation.max-attempts=5
mlsuite.model-preparation.poll-ms=2000
# How long the inferences table's stored rows wait between looks for runs to project again.
mlsuite.inference-rows.refresh-ms=5000

# API clients: how many of their runs may use the shared runtime at once (apart from public
# pages), how many calls one client may make in a clock minute, how many calls an organization's
# clients may make in a calendar month unless a superadmin sets its own limit, and how many days
# each call is kept. The month is counted from the kept calls, so they are kept at least 31 days.
mlsuite.api-access.max-concurrent=${API_ACCESS_MAX_CONCURRENT:2}
mlsuite.api-access.requests-per-minute=${API_ACCESS_REQUESTS_PER_MINUTE:60}
mlsuite.api-access.monthly-calls=${API_ACCESS_MONTHLY_CALLS:10000}
mlsuite.api-access.request-retention-days=${API_ACCESS_REQUEST_RETENTION_DAYS:90}

# How many days a notification is kept once read, and how many are removed per batch. Unread ones stay.
mlsuite.notifications.retention-days=${NOTIFICATIONS_RETENTION_DAYS:30}
mlsuite.notifications.retention-batch-size=1000

# How many days the audit log keeps an entry; older entries are pruned every hour.
audit.retention-days=${AUDIT_RETENTION_DAYS:7}

# Every runtime share queues the runs that find it in use, in arrival order: at most this many
# wait in each share, one caller (a member, a public page's network or account, an API client)
# holds at most this many places in a share, running or waiting, and a run waits at most this
# long for its turn. Past any of them the run is answered 503 with Retry-After.
mlsuite.runtime-queue.max-waiting=${RUNTIME_QUEUE_MAX_WAITING:1000}
mlsuite.runtime-queue.max-per-caller=${RUNTIME_QUEUE_MAX_PER_CALLER:16}
mlsuite.runtime-queue.max-wait-ms=${RUNTIME_QUEUE_MAX_WAIT_MS:5000}

# Requests run on virtual threads: a run waiting for the runtime holds no platform thread, so it
# never delays unrelated requests. The runtime shares, not the thread count, bound runtime work.
spring.threads.virtual.enabled=true

# Sign-in and registration: how many failed sign-ins and how many registration attempts one network
# may make in 15 minutes before it must wait for the window to end.
mlsuite.auth.max-login-failures=${AUTH_MAX_LOGIN_FAILURES:10}
mlsuite.auth.max-registrations=${AUTH_MAX_REGISTRATIONS:5}

mlsuite.ops-agent.base-url=${OPS_AGENT_BASE_URL:http://localhost:8091}
mlsuite.ops-agent.shared-secret=${OPS_AGENT_SHARED_SECRET:}

# Signs the predictions the API performs for workspace runs; a run can only be saved with results
# signed here. Required: at least 32 random characters, the same on every API instance.
mlsuite.prediction-attestation.secret=${PREDICTION_ATTESTATION_SECRET:}
