###############################
# application-test.properties – Perfil “test”
###############################

# Flyway is the only schema owner in integration tests.
spring.sql.init.mode=never

###############################
# Data Source – Base de datos de test
###############################

# Driver JDBC para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:tc:postgresql:17:///mlsuite
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
storage.enabled=false
storage.retain-inline-copy=true
spring.flyway.enabled=true

# Optional quality-of-life
spring.test.database.replace=none
logging.testcontainers=true

###############################
# JPA / Hibernate – Esquema y SQL
###############################

# Mostrar sentencias SQL en consola para verificación de pruebas
spring.jpa.show-sql=false
