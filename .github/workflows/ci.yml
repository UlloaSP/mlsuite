name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify secret-scan success and failure cases
        run: python3 -m unittest discover -s .github/tests -p test_secret_scan.py
      - name: Scan tracked tree and new commits
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/scan-secrets.py --base "$SCAN_BASE" --head "$SCAN_HEAD"

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: 0.3.3
          node-version: '26'
          working-directory: frontend
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp test --run
        env:
          # Let jsdom supply browser storage instead of Node 26's incomplete global.
          NODE_OPTIONS: --no-webstorage
      - run: vp run build

  api:
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: api/pom.xml
      - run: mvn -B -ntp verify
      - name: Require PostgreSQL integration tests
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          expected = {
              "dev.ulloasp.mlsuite.storage.FlywayMigrationTest": 2,
              "dev.ulloasp.mlsuite.storage.PostgresArtifactMigrationQueueTest": 1,
              "dev.ulloasp.mlsuite.storage.PostgresStorageDeletionWorkQueueTest": 2,
              "dev.ulloasp.mlsuite.model.ModelOptimisticLockTest": 1,
          }
          for name, minimum in expected.items():
              report = pathlib.Path(f"target/surefire-reports/TEST-{name}.xml")
              if not report.is_file():
                  raise SystemExit(f"missing PostgreSQL test report: {report}")
              suite = ET.parse(report).getroot()
              tests = int(suite.attrib.get("tests", 0))
              skipped = int(suite.attrib.get("skipped", 0))
              if tests < minimum or skipped:
                  raise SystemExit(f"{name} did not run completely: tests={tests}, skipped={skipped}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: api-test-results
          path: api/target/surefire-reports/
          retention-days: 7

  python:
    name: Python (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [backend, ops-agent]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.17
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: '${{ matrix.component }}/uv.lock'
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev pytest tests --junitxml=test-results.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ matrix.component }}-test-results
          path: ${{ matrix.component }}/test-results.xml
          retention-days: 7

  configuration:
    name: Configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require main promotions to come from develop
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_BRANCH" != develop || "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo 'Promote to main through a PR from this repository develop branch.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject tracked private environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo 'Private environment files must not be tracked.' >&2
            exit 1
          fi
      - name: Validate Compose using the public template
        run: |
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml --profile operations config --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml --profile operations config --quiet
          python3 deploy/test_compose_parity.py
      - name: Verify PostgreSQL role upgrade
        run: bash deploy/postgres/test-provision-roles.sh
      - name: Verify non-empty backup restore lifecycle
        run: bash deploy/test-backup-restore.sh
      - name: Verify single-disk local backup contract
        run: bash deploy/test-local-backup.sh
      - name: Validate release contracts and failure handling
        run: python3 -m unittest discover -s .github/tests -p 'test_release_*.py'
      - name: Validate workflows
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  required:
    name: CI required
    if: always()
    needs: [frontend, api, python, configuration, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
