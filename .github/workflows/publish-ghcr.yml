name: Publish immutable release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: immutable-release-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      exists: ${{ steps.release.outputs.exists }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: release
        name: Validate main ref and reuse an existing immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 .github/scripts/release_publish.py prepare --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"

  ci:
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [prepare, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, api, backend, ops-agent]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify the candidate image
        id: image
        env:
          SERVICE: ${{ matrix.service }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          image=$(python3 -c 'import sys; sys.path.insert(0, ".github/scripts"); from release_manifest import image_name; print(image_name(sys.argv[1], sys.argv[2]))' "$RELEASE_REPOSITORY" "$SERVICE")
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - name: Build candidate with SBOM and provenance
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Reject high or critical image vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: json
          output: trivy-results.json
          exit-code: '1'
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          timeout: 10m
      - name: Retain scan results even on failure
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulnerability-report-${{ matrix.service }}
          path: trivy-results.json
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      - name: Record a successfully scanned image
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p image-record
          python3 -c 'import json,os,pathlib; record={k:os.environ[k.upper()] for k in ("service","image","digest","commit")}; pathlib.Path("image-record/image.json").write_text(json.dumps(record), encoding="utf-8")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-record-${{ matrix.service }}
          path: image-record/image.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-record-*
          path: image-records
      - name: Validate the complete release and create digest-only assets
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release }}
        run: >-
          python3 .github/scripts/release_manifest.py --input image-records
          --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"
          --release "$RELEASE_TAG" --output release
      - name: Upload draft assets, verify, publish and require immutability
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          python3 .github/scripts/release_publish.py publish --repository "$RELEASE_REPOSITORY"
          --commit "$RELEASE_COMMIT" --directory release
