name: Publish immutable release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: immutable-release-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      exists: ${{ steps.release.outputs.exists }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: release
        name: Validate main ref and reuse an existing immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 .github/scripts/release_publish.py prepare --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"

  ci:
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [prepare, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, api, backend, ops-agent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify the candidate image
        id: image
        env:
          SERVICE: ${{ matrix.service }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          image=$(python3 -c 'import sys; sys.path.insert(0, ".github/scripts"); from release_manifest import image_name; print(image_name(sys.argv[1], sys.argv[2]))' "$RELEASE_REPOSITORY" "$SERVICE")
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - name: Build candidate with SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Scan the exact candidate digest
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          report-name: vulnerability-report-${{ matrix.service }}
      - name: Record a successfully scanned image
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p image-record
          python3 -c 'import json,os,pathlib; record={k:os.environ[k.upper()] for k in ("service","image","digest","commit")}; pathlib.Path("image-record/image.json").write_text(json.dumps(record), encoding="utf-8")'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-record-${{ matrix.service }}
          path: image-record/image.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-record-*
          path: image-records
      - name: Validate the complete release and create digest-only assets
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release }}
        run: >-
          python3 .github/scripts/release_manifest.py --input image-records
          --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"
          --release "$RELEASE_TAG" --output release
      - name: Upload draft assets, verify, publish and require immutability
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: >-
          python3 .github/scripts/release_publish.py publish --repository "$RELEASE_REPOSITORY"
          --commit "$RELEASE_COMMIT" --directory release
