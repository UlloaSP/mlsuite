name: Deploy websites

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ matrix.site }}
    if: github.repository == 'UlloaSP/mlsuite' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: landing
            url: https://mlsuite.eshkra.dev
            title: MLsuite
          - site: docs
            url: https://docs.mlsuite.eshkra.dev
            title: MLsuite documentation
    environment:
      name: ${{ matrix.site }}
      url: ${{ matrix.url }}
    concurrency:
      group: mlsuite-${{ matrix.site }}-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: 1.3.0
          node-version: '26'
          working-directory: ${{ matrix.site }}
          cache: true
          run-install: false
      - name: Install locked deployment tooling
        working-directory: ${{ matrix.site }}
        run: vp install --frozen-lockfile
      - name: Download tested site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.site }}-build
          path: ${{ matrix.site }}/dist/
      - name: Deploy static assets and custom domain
        working-directory: ${{ matrix.site }}
        run: vp exec wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the deployed homepage
        env:
          SITE_URL: ${{ matrix.url }}
          EXPECTED_TITLE: ${{ matrix.title }}
        run: |
          curl --fail --silent --show-error --location --retry 10 --retry-delay 15 \
            --retry-all-errors --max-time 20 "$SITE_URL/" -o "$RUNNER_TEMP/site.html"
          grep -Fq "<title>$EXPECTED_TITLE" "$RUNNER_TEMP/site.html"
