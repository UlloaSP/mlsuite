name: Scan production image
description: Block vulnerable images and retain the Trivy report on success or failure.
inputs:
  image-ref:
    description: Local image tag or immutable registry digest to scan.
    required: true
  report-name:
    description: Unique artifact name for this scan.
    required: true
runs:
  using: composite
  steps:
    - name: Reject high or critical image vulnerabilities
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        version: v0.74.0
        image-ref: ${{ inputs.image-ref }}
        scanners: vuln
        format: json
        output: trivy-results.json
        exit-code: '1'
        ignore-unfixed: false
        severity: HIGH,CRITICAL
        timeout: 10m
    - name: Retain scan results even on failure
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.report-name }}
        path: trivy-results.json
        retention-days: 30
        if-no-files-found: error
        overwrite: true
