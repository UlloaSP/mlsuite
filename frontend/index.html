<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mlsuite-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/shared/ui/appearance.css" />
    <!-- 1. El navegador sabe que hay dos esquemas de color -->
    <meta name="color-scheme" content="dark light" />

    <!-- 2. Dirección cromática de la UI del browser -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101828" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <title>ML Suite</title>
    <style>
      @import "tailwindcss";
      @custom-variant dark (&:where(.dark, .dark *));

      :root {
        color-scheme: light;
        --ui-font-size: 16px;
        --code-font-size: 13px;
        --font-sans: "Manrope", "Trebuchet MS", sans-serif;
        --font-display: "Manrope", "Trebuchet MS", sans-serif;
        --font-mono: "DM Mono", "Consolas", ui-monospace, monospace;
        --radius-card: 24px;
        --radius-pill: 999px;
        background: var(--page-bg);
        font-size: var(--ui-font-size);
        font-family: var(--font-sans);
      }

      html[data-interface-font="segoe"] {
        --font-sans: "IBM Plex Sans", Arial, sans-serif;
        --font-display: "IBM Plex Sans", Arial, sans-serif;
      }

      html[data-interface-font="avenir"] {
        --font-sans: "Source Sans 3", Verdana, sans-serif;
        --font-display: "Source Sans 3", Verdana, sans-serif;
      }

      html[data-interface-font="system"] {
        --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-display: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      html[data-monospace-font="consolas"] {
        --font-mono: "Consolas", "Courier New", monospace;
      }

      html[data-monospace-font="system-mono"] {
        --font-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
      }

      html.dark {
        color-scheme: dark;
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top, var(--page-bg-accent), transparent 34%), var(--page-bg);
        color: var(--text-primary);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      button:not(:disabled),
      [role="button"]:not([aria-disabled="true"]) {
        cursor: pointer;
      }

      ::selection {
        background: color-mix(in srgb, var(--accent-primary) 24%, transparent);
      }

      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
      }

      .theme-corner-transition::view-transition-new(root) {
        animation: theme-corner-reveal 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
        clip-path: circle(150vmax at 0 0);
        mix-blend-mode: normal;
      }

      .theme-corner-transition::view-transition-old(root) {
        animation: none;
        mix-blend-mode: normal;
      }

      :root.theme-corner-transition::view-transition-group(root) {
        animation: none !important;
      }

      ::view-transition-old(app-content),
      ::view-transition-new(app-content) {
        animation-duration: 220ms;
        animation-timing-function: ease-out;
        mix-blend-mode: normal;
      }

      ::view-transition-old(app-content) {
        animation-name: app-route-fade-out;
      }

      ::view-transition-new(app-content) {
        animation-name: app-route-fade-in;
      }

      @keyframes app-route-fade-out {
        from {
          opacity: 1;
        }

        to {
          opacity: 0;
        }
      }

      @keyframes app-route-fade-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes theme-corner-reveal {
        from {
          clip-path: circle(0 at 0 0);
        }

        to {
          clip-path: circle(150vmax at 0 0);
        }
      }

      .app-scroll {
        scrollbar-width: thin;
        scrollbar-color: var(--border-strong) transparent;
      }

      .app-scroll::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      .app-scroll::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: color-mix(in srgb, var(--border-strong) 82%, transparent);
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }

        ::view-transition-old(root),
        ::view-transition-new(root),
        ::view-transition-old(app-content),
        ::view-transition-new(app-content) {
          animation: none !important;
        }
      }
    </style>
    <script src="/appearance-boot.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
