# Link-unfurling crawlers do not run the app, so a public bookmark's page is described to them by
# the API (Open Graph tags and a redirect to the page). Only these user agents are sent there;
# a browser always gets the app.
map $http_user_agent $mlsuite_link_crawler {
  default 0;
  "~*(facebookexternalhit|facebookcatalog|Twitterbot|LinkedInBot|Slackbot|Discordbot|TelegramBot|WhatsApp|Pinterest|Embedly|Mastodon|Bluesky|Applebot|Googlebot|bingbot|DuckDuckBot|redditbot|SkypeUriPreview|Iframely)" 1;
}

server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;
  client_max_body_size 1000m;
  resolver 127.0.0.11 valid=5s ipv6=off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control "no-cache" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1000;

  location /api/ {
    set $api_backend spring-app:8080;
    proxy_pass http://$api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The address public runs are counted against. X-Forwarded-For starts with whatever the
    # client sent; this header is only the peer nginx accepted and replaces any the client sent.
    proxy_set_header X-MLSuite-Client-Address $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # A public bookmark's page: the app for people, its preview from the API for link crawlers.
  location ~ ^/explore/(?<public_id>[A-Za-z0-9-]+)$ {
    set $api_backend spring-app:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    if ($mlsuite_link_crawler) {
      proxy_pass http://$api_backend/api/public/bookmarks/$public_id/preview;
    }
    try_files /index.html =404;
  }

  # Boot screen data: public, read-only compose states served by ops-agent while
  # spring-app may still be starting.
  location = /startup/services {
    limit_except GET { deny all; }
    set $ops_backend ops-agent:8091;
    proxy_pass http://$ops_backend/startup/services;
    proxy_http_version 1.1;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
