# Link-unfurling crawlers do not run the app, so a public bookmark's page is described to them by
# the API (Open Graph tags and a redirect to the page). Only these user agents are sent there;
# a browser always gets the app.
map $http_user_agent $mlsuite_link_crawler {
  default 0;
  "~*(facebookexternalhit|facebookcatalog|Twitterbot|LinkedInBot|Slackbot|Discordbot|TelegramBot|WhatsApp|Pinterest|Embedly|Mastodon|Bluesky|Applebot|Googlebot|bingbot|DuckDuckBot|redditbot|SkypeUriPreview|Iframely)" 1;
}

# The API keeps idle connections open for reuse instead of connecting for every request, which
# runs out of local ports under load. `resolve` follows spring-app's address as Docker's DNS
# changes it, so nginx starts before the API exists.
upstream mlsuite_api {
  zone mlsuite_api 64k;
  resolver 127.0.0.11 valid=5s ipv6=off;
  server spring-app:8080 resolve;
  keepalive 64;
  # Shorter than the API's own idle timeout, so nginx never reuses a connection the API closed.
  keepalive_timeout 15s;
}

# Only a WebSocket upgrade (the admin terminal and infrastructure streams) asks for one; every
# other request leaves Connection empty, so its upstream connection is kept for the next.
map $http_upgrade $mlsuite_api_connection {
  default upgrade;
  "" "";
}

server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;
  client_max_body_size 513m;
  resolver 127.0.0.11 valid=5s ipv6=off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control "no-cache" always;
  # The app runs only its own scripts: plugin code runs in the plugin sandbox below, never here.
  # Styles allow inline rules for the editor and the toasts; WebAssembly is the code highlighter's.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1000;

  location /api/ {
    proxy_pass http://mlsuite_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The address public runs are counted against. X-Forwarded-For starts with whatever the
    # client sent; this header is only the peer nginx accepted and replaces any the client sent.
    proxy_set_header X-MLSuite-Client-Address $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $mlsuite_api_connection;
  }

  # A public bookmark's page: the app for people, its preview from the API for link crawlers.
  location ~ ^/explore/(?<public_id>[A-Za-z0-9-]+)$ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    if ($mlsuite_link_crawler) {
      proxy_pass http://mlsuite_api/api/public/bookmarks/$public_id/preview;
    }
    try_files /index.html =404;
  }

  # Boot screen data: public, read-only compose states served by ops-agent while
  # spring-app may still be starting.
  location = /startup/services {
    limit_except GET { deny all; }
    set $ops_backend ops-agent:8091;
    proxy_pass http://$ops_backend/startup/services;
    proxy_http_version 1.1;
  }

  # Built files are public. The plugin sandbox has an opaque origin, so its module scripts and
  # styles are cross-origin requests that need CORS; they are fetched without credentials.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # The plugin sandbox: the only document that runs plugin code. The CSP sandbox keeps its origin
  # opaque even when it is opened outside the app's frame, so it never has the user's cookies,
  # storage or DOM; it connects nowhere (the app makes every request), loads only the app's
  # scripts and the plugins it compiles (blob:), and only the app may frame it.
  location = /plugin-sandbox.html {
    try_files $uri =404;
    add_header Content-Security-Policy "sandbox allow-scripts allow-forms; default-src 'none'; script-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location / {
    try_files $uri /index.html;
  }
}
