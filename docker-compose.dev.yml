networks:
  appnet:


volumes:
  pg_data:
  minio_data:


services:
  ops-agent:
    build:
      context: ./ops-agent
      dockerfile: ./Dockerfile
    environment:
      OPS_AGENT_HOST: ${OPS_AGENT_HOST}
      OPS_AGENT_PORT: ${OPS_AGENT_PORT}
      OPS_AGENT_SHARED_SECRET: ${OPS_AGENT_SHARED_SECRET}
      OPS_AGENT_DOCKER_BIN: ${OPS_AGENT_DOCKER_BIN}
      OPS_AGENT_COMPOSE_FILE: /workspace/docker-compose.dev.yml
      OPS_AGENT_COMPOSE_PROJECT: ${OPS_AGENT_COMPOSE_PROJECT}
      OPS_AGENT_MANAGED_SERVICES: ${OPS_AGENT_MANAGED_SERVICES}
      OPS_AGENT_SAMPLE_INTERVAL_SECONDS: ${OPS_AGENT_SAMPLE_INTERVAL_SECONDS}
      OPS_AGENT_RETENTION_MINUTES: ${OPS_AGENT_RETENTION_MINUTES}
      OPS_AGENT_TERMINAL_SERVICES: ${OPS_AGENT_TERMINAL_SERVICES}
      OPS_AGENT_TERMINAL_IDLE_MINUTES: ${OPS_AGENT_TERMINAL_IDLE_MINUTES}
      OPS_AGENT_TERMINAL_MAX_SESSIONS: ${OPS_AGENT_TERMINAL_MAX_SESSIONS}
      OPS_AGENT_LOG_TAIL_LINES: ${OPS_AGENT_LOG_TAIL_LINES}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
    networks: [ appnet ]

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${DB_PROD}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASS}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - ${DB_HOST_PORT}:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_PROD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ appnet ]

  db-provision:
    image: postgres:17.11-alpine3.24
    command: [ "/bin/sh", "/usr/local/bin/provision-roles.sh" ]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DB_PROD}
      PGUSER: ${DB_ADMIN_USER}
      PGPASSWORD: ${DB_ADMIN_PASS}
      DB_ADMIN_USER: ${DB_ADMIN_USER}
      DB_ADMIN_PASS: ${DB_ADMIN_PASS}
      DB_LEGACY_OWNER: ${DB_LEGACY_OWNER}
      DB_LEGACY_PASS: ${DB_LEGACY_PASS}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASS: ${DB_MIGRATION_PASS}
    volumes:
      - ./deploy/postgres/provision-roles.sh:/usr/local/bin/provision-roles.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ appnet ]
    restart: "no"

  py-analyzer:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    environment:
      PYTHON_HOST: ${PYTHON_HOST}
      PYTHON_PORT: ${PYTHON_PORT}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ appnet ]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address "${MINIO_CONSOLE_ADDRESS}"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ appnet ]

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -eu
        mc alias set local "$$STORAGE_ENDPOINT" "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY"
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"
        mc version enable "local/$$STORAGE_BUCKET"
        version_info=$$(mc version info "local/$$STORAGE_BUCKET")
        case "$$version_info" in *[Ee]nabled*) printf '%s\n' "$$version_info";; *) printf '%s\n' "$$version_info" >&2; exit 1;; esac
    environment:
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    depends_on:
      minio:
        condition: service_healthy
    networks: [ appnet ]
    restart: "no"

  spring-app:
    build:
      context: ./api
      dockerfile: ./Dockerfile
    environment:
      SPRING_PORT: ${SPRING_PORT}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      LOG_PATH: ${LOG_PATH}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_PROD: ${DB_PROD}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-30000}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      ANALYZER_BASE_URL: ${ANALYZER_BASE_URL}
      REVIEW_LINK_SECRET: ${REVIEW_LINK_SECRET}
      STORAGE_ENABLED: ${STORAGE_ENABLED}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_AUTO_CREATE_BUCKET: ${STORAGE_AUTO_CREATE_BUCKET}
      STORAGE_RETAIN_INLINE_COPY: ${STORAGE_RETAIN_INLINE_COPY}
      STORAGE_DELETION_ENABLED: ${STORAGE_DELETION_ENABLED}
      STORAGE_DELETION_BATCH_SIZE: ${STORAGE_DELETION_BATCH_SIZE:-20}
      STORAGE_DELETION_STALE_AFTER_SECONDS: ${STORAGE_DELETION_STALE_AFTER_SECONDS:-300}
      MODEL_MUTATIONS_REQUIRE_VERSION: ${MODEL_MUTATIONS_REQUIRE_VERSION:-false}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASS: ${DB_MIGRATION_PASS}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      MLSUITE_SUPERADMIN_EMAIL: ${MLSUITE_SUPERADMIN_EMAIL}
      MLSUITE_SUPERADMIN_PASSWORD: ${MLSUITE_SUPERADMIN_PASSWORD}
      MLSUITE_SUPERADMIN_FULL_NAME: ${MLSUITE_SUPERADMIN_FULL_NAME}
      MLSUITE_SUPERADMIN_USERNAME: ${MLSUITE_SUPERADMIN_USERNAME}
      OPS_AGENT_BASE_URL: ${OPS_AGENT_BASE_URL}
      OPS_AGENT_SHARED_SECRET: ${OPS_AGENT_SHARED_SECRET}
    depends_on:
      ops-agent:
        condition: service_started
      postgres:
        condition: service_healthy
      db-provision:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks: [ appnet ]

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
    ports:
      - ${WEB_PORT}:5173
    depends_on:
      spring-app:
        condition: service_started
    networks: [ appnet ]
