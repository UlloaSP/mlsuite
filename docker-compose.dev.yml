# Development selects locally built images; service behavior lives in docker-compose.yml.
x-api-dev: &api-dev
  image: mlsuite-api:dev
  build:
    context: ./api
    dockerfile: ./Dockerfile

services:
  ops-agent:
    image: mlsuite-ops-agent:dev
    build:
      context: ./ops-agent
      dockerfile: ./Dockerfile
    environment:
      OPS_AGENT_COMPOSE_FILES: /workspace/docker-compose.yml,/workspace/docker-compose.dev.yml

  py-analyzer:
    image: mlsuite-sklearn-backend:dev
    build:
      context: ./backend
      dockerfile: ./Dockerfile

  db-migrate: *api-dev
  artifact-migrate: *api-dev
  spring-app: *api-dev

  frontend:
    image: mlsuite-frontend:dev
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
