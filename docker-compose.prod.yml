networks:
  appnet:


volumes:
  pg_data:
  minio_data:


services:
  ops-agent:
    image: ${REGISTRY:-ghcr.io}/${OWNER}/${OPS_AGENT_IMAGE:-mlsuite-ops-agent}:${OPS_AGENT_VERSION:-latest}
    environment:
      OPS_AGENT_HOST: ${OPS_AGENT_HOST}
      OPS_AGENT_PORT: ${OPS_AGENT_PORT}
      OPS_AGENT_SHARED_SECRET: ${OPS_AGENT_SHARED_SECRET}
      OPS_AGENT_DOCKER_BIN: ${OPS_AGENT_DOCKER_BIN}
      OPS_AGENT_COMPOSE_FILE: /workspace/docker-compose.prod.yml
      OPS_AGENT_COMPOSE_PROJECT: ${OPS_AGENT_COMPOSE_PROJECT}
      OPS_AGENT_MANAGED_SERVICES: ${OPS_AGENT_MANAGED_SERVICES}
      OPS_AGENT_SAMPLE_INTERVAL_SECONDS: ${OPS_AGENT_SAMPLE_INTERVAL_SECONDS}
      OPS_AGENT_RETENTION_MINUTES: ${OPS_AGENT_RETENTION_MINUTES}
      OPS_AGENT_TERMINAL_SERVICES: ${OPS_AGENT_TERMINAL_SERVICES}
      OPS_AGENT_TERMINAL_IDLE_MINUTES: ${OPS_AGENT_TERMINAL_IDLE_MINUTES}
      OPS_AGENT_TERMINAL_MAX_SESSIONS: ${OPS_AGENT_TERMINAL_MAX_SESSIONS}
      OPS_AGENT_LOG_TAIL_LINES: ${OPS_AGENT_LOG_TAIL_LINES}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
    networks: [ appnet ]
    restart: unless-stopped

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${DB_PROD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - ${DB_HOST_PORT}:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_PROD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ appnet ]
    restart: unless-stopped

  py-analyzer:
    image: ${REGISTRY:-ghcr.io}/${OWNER}/${BACKEND_IMAGE:-mlsuite-sklearn-backend}:${BACKEND_VERSION:-latest}
    environment:
      PYTHON_HOST: ${PYTHON_HOST}
      PYTHON_PORT: ${PYTHON_PORT}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ appnet ]
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address "${MINIO_CONSOLE_ADDRESS}"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ appnet ]
    restart: unless-stopped

  db-migrate:
    image: ${REGISTRY:-ghcr.io}/${OWNER}/${API_IMAGE:-mlsuite-api}:${API_VERSION}
    environment:
      MLSUITE_MODE: migrate
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      LOG_PATH: ${LOG_PATH}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_PROD: ${DB_PROD}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASS: ${DB_MIGRATION_PASS}
      FLYWAY_ENABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      FLYWAY_BASELINE_VERSION: ${FLYWAY_BASELINE_VERSION:-1}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ appnet ]
    restart: "no"

  artifact-migrate:
    profiles: [ operations ]
    image: ${REGISTRY:-ghcr.io}/${OWNER}/${API_IMAGE:-mlsuite-api}:${API_VERSION}
    environment:
      MLSUITE_MODE: artifact-migrate
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      LOG_PATH: ${LOG_PATH}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_PROD: ${DB_PROD}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      FLYWAY_ENABLED: "false"
      STORAGE_ENABLED: "true"
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_AUTO_CREATE_BUCKET: "false"
      STORAGE_RETAIN_INLINE_COPY: "true"
      ARTIFACT_MIGRATION_COMMAND: ${ARTIFACT_MIGRATION_COMMAND:-status}
      ARTIFACT_MIGRATION_BATCH_SIZE: ${ARTIFACT_MIGRATION_BATCH_SIZE:-10}
      ARTIFACT_MIGRATION_MAX_ATTEMPTS: ${ARTIFACT_MIGRATION_MAX_ATTEMPTS:-5}
      ARTIFACT_MIGRATION_STALE_AFTER_SECONDS: ${ARTIFACT_MIGRATION_STALE_AFTER_SECONDS:-900}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    networks: [ appnet ]
    restart: "no"

  spring-app:
    image: ${REGISTRY:-ghcr.io}/${OWNER}/${API_IMAGE:-mlsuite-api}:${API_VERSION:-latest}
    environment:
      SPRING_PORT: ${SPRING_PORT}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      LOG_PATH: ${LOG_PATH}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_PROD: ${DB_PROD}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      FLYWAY_ENABLED: "false"
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      ANALYZER_BASE_URL: ${ANALYZER_BASE_URL}
      REVIEW_LINK_SECRET: ${REVIEW_LINK_SECRET}
      STORAGE_ENABLED: ${STORAGE_ENABLED}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_AUTO_CREATE_BUCKET: ${STORAGE_AUTO_CREATE_BUCKET}
      STORAGE_RETAIN_INLINE_COPY: ${STORAGE_RETAIN_INLINE_COPY}
      STORAGE_DELETION_ENABLED: ${STORAGE_DELETION_ENABLED}
      MLSUITE_SUPERADMIN_EMAIL: ${MLSUITE_SUPERADMIN_EMAIL}
      MLSUITE_SUPERADMIN_PASSWORD: ${MLSUITE_SUPERADMIN_PASSWORD}
      MLSUITE_SUPERADMIN_FULL_NAME: ${MLSUITE_SUPERADMIN_FULL_NAME}
      MLSUITE_SUPERADMIN_USERNAME: ${MLSUITE_SUPERADMIN_USERNAME}
      OPS_AGENT_BASE_URL: ${OPS_AGENT_BASE_URL}
      OPS_AGENT_SHARED_SECRET: ${OPS_AGENT_SHARED_SECRET}
    depends_on:
      ops-agent:
        condition: service_started
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:${SPRING_PORT}/actuator/health/readiness >/dev/null" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [ appnet ]
    restart: unless-stopped

  frontend:
    image: ${REGISTRY:-ghcr.io}/${OWNER}/${FRONTEND_IMAGE:-mlsuite-frontend}:${FRONTEND_VERSION:-latest}
    ports:
      - ${WEB_PORT}:5173
    depends_on:
      spring-app:
        condition: service_healthy
    networks: [ appnet ]
    restart: unless-stopped
