# Shared service topology. Always combine this file with the dev or prod image override.

# Settings shared by the API image's migrate, artifact-prune and server modes.
x-api-env: &api-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
  LOG_PATH: ${LOG_PATH}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_PROD: ${DB_PROD}
  DB_USER: ${DB_USER}
  DB_PASS: ${DB_PASS}

x-api-pool-env: &api-pool-env
  <<: *api-env
  DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
  DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
  DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-30000}

# Docker keeps every container's output on the host disk; rotate it so it cannot fill it.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"


# Each network joins only the services that call each other. The browser reaches nginx,
# which proxies to the API and to the agent's boot-status endpoint; the API alone reaches
# the stores, the runtime and the builder. The runtime runs untrusted uploaded models, so its
# network is internal: it reaches neither the agent, the stores nor the internet. The builder
# alone downloads packages (egress), and only the API reaches it (build, internal).
networks:
  edge:
  data:
  runtime:
    internal: true
  build:
    internal: true
  egress:


volumes:
  pg_data:
  rustfs_data:
  # The environments the builder installs and the runtime runs models in. A cache: lost, it is
  # rebuilt from the bundles' locks, so it is not backed up.
  runtime_environments:


services:
  ops-agent:
    environment:
      OPS_AGENT_HOST: ${OPS_AGENT_HOST}
      OPS_AGENT_PORT: ${OPS_AGENT_PORT}
      OPS_AGENT_SHARED_SECRET: ${OPS_AGENT_SHARED_SECRET}
      OPS_AGENT_DOCKER_BIN: ${OPS_AGENT_DOCKER_BIN}
      OPS_AGENT_COMPOSE_PROJECT: ${OPS_AGENT_COMPOSE_PROJECT}
      OPS_AGENT_MANAGED_SERVICES: ${OPS_AGENT_MANAGED_SERVICES}
      OPS_AGENT_SAMPLE_INTERVAL_SECONDS: ${OPS_AGENT_SAMPLE_INTERVAL_SECONDS}
      OPS_AGENT_RETENTION_MINUTES: ${OPS_AGENT_RETENTION_MINUTES}
      OPS_AGENT_TERMINAL_SERVICES: ${OPS_AGENT_TERMINAL_SERVICES}
      OPS_AGENT_TERMINAL_IDLE_MINUTES: ${OPS_AGENT_TERMINAL_IDLE_MINUTES}
      OPS_AGENT_TERMINAL_MAX_SESSIONS: ${OPS_AGENT_TERMINAL_MAX_SESSIONS}
      OPS_AGENT_LOG_TAIL_LINES: ${OPS_AGENT_LOG_TAIL_LINES}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
    networks: [ edge ]
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: ${DB_PROD}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASS}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Loopback only: Docker-published ports bypass host firewalls such as ufw.
    ports:
      - 127.0.0.1:${DB_HOST_PORT}:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "grep -qx postgres /proc/1/comm && pg_isready -U ${DB_ADMIN_USER} -d ${DB_PROD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ data ]
    restart: unless-stopped
    logging: *logging

  db-provision:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    command: [ "/bin/sh", "/usr/local/bin/provision-roles.sh" ]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DB_PROD}
      PGUSER: ${DB_ADMIN_USER}
      PGPASSWORD: ${DB_ADMIN_PASS}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASS: ${DB_MIGRATION_PASS}
    volumes:
      - ./deploy/postgres/provision-roles.sh:/usr/local/bin/provision-roles.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ data ]
    restart: "no"
    logging: *logging

  py-analyzer:
    environment:
      PYTHON_HOST: ${PYTHON_HOST}
      PYTHON_PORT: ${PYTHON_PORT}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      RUNTIME_WORKERS: ${RUNTIME_WORKERS:-2}
      RUNTIME_BUNDLE_CACHE_MB: ${RUNTIME_BUNDLE_CACHE_MB:-512}
    volumes:
      - runtime_environments:/var/lib/mlsuite/environments:ro
    mem_limit: ${RUNTIME_MEMORY_LIMIT:-6g}
    healthcheck:
      test: [ "CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${PYTHON_PORT}/health', timeout=4)" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [ runtime ]
    restart: unless-stopped
    logging: *logging

  runtime-builder:
    command: [ "mlsuite_backend.builder" ]
    environment:
      RUNTIME_BUILDER_HOST: ${RUNTIME_BUILDER_HOST}
      RUNTIME_BUILDER_PORT: ${RUNTIME_BUILDER_PORT}
      RUNTIME_PACKAGE_INDEX_URL: ${RUNTIME_PACKAGE_INDEX_URL:-https://pypi.org/simple}
    volumes:
      - runtime_environments:/var/lib/mlsuite/environments
    mem_limit: ${RUNTIME_BUILDER_MEMORY_LIMIT:-2g}
    healthcheck:
      test: [ "CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${RUNTIME_BUILDER_PORT}/health', timeout=4)" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [ build, egress ]
    restart: unless-stopped
    logging: *logging

  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOG_DIRECTORY: ""
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/health/ready" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ data ]
    restart: unless-stopped
    logging: *logging

  rustfs-init:
    image: rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    entrypoint: [ "/bin/sh", "/config/provision.sh" ]
    environment:
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    volumes:
      - ./deploy/rustfs/provision.sh:/config/provision.sh:ro
    depends_on:
      rustfs:
        condition: service_healthy
    networks: [ data ]
    restart: "no"
    logging: *logging

  db-migrate:
    environment:
      <<: *api-env
      MLSUITE_MODE: migrate
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASS: ${DB_MIGRATION_PASS}
      FLYWAY_ENABLED: "true"
    depends_on:
      db-provision:
        condition: service_completed_successfully
    networks: [ data ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    logging: *logging

  artifact-prune:
    profiles: [ operations ]
    environment:
      <<: *api-pool-env
      MLSUITE_MODE: artifact-prune
      FLYWAY_ENABLED: "false"
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_AUTO_CREATE_BUCKET: "false"
      ARTIFACT_ORPHAN_GRACE_SECONDS: ${ARTIFACT_ORPHAN_GRACE_SECONDS:-86400}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
    networks: [ data ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    logging: *logging

  spring-app:
    environment:
      <<: *api-pool-env
      SPRING_PORT: ${SPRING_PORT}
      FLYWAY_ENABLED: "false"
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      ANALYZER_BASE_URL: ${ANALYZER_BASE_URL}
      RUNTIME_BUILDER_BASE_URL: ${RUNTIME_BUILDER_BASE_URL}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_AUTO_CREATE_BUCKET: ${STORAGE_AUTO_CREATE_BUCKET}
      STORAGE_DELETION_ENABLED: ${STORAGE_DELETION_ENABLED}
      STORAGE_DELETION_BATCH_SIZE: ${STORAGE_DELETION_BATCH_SIZE:-20}
      STORAGE_DELETION_STALE_AFTER_SECONDS: ${STORAGE_DELETION_STALE_AFTER_SECONDS:-300}
      STORAGE_DELETION_RETENTION_DAYS: ${STORAGE_DELETION_RETENTION_DAYS:-7}
      PURGE_BATCH_SIZE: ${PURGE_BATCH_SIZE:-1000}
      MODEL_MUTATIONS_REQUIRE_VERSION: ${MODEL_MUTATIONS_REQUIRE_VERSION:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      PREDICTION_ATTESTATION_SECRET: ${PREDICTION_ATTESTATION_SECRET}
      PUBLIC_PREDICTION_MAX_MODEL_SIZE_MB: ${PUBLIC_PREDICTION_MAX_MODEL_SIZE_MB:-50}
      PUBLIC_PREDICTION_MAX_CONCURRENT: ${PUBLIC_PREDICTION_MAX_CONCURRENT:-2}
      PUBLIC_PREDICTION_ANONYMOUS_RUNS_PER_DAY: ${PUBLIC_PREDICTION_ANONYMOUS_RUNS_PER_DAY:-50}
      PUBLIC_PREDICTION_SIGNED_IN_RUNS_PER_DAY: ${PUBLIC_PREDICTION_SIGNED_IN_RUNS_PER_DAY:-500}
      API_ACCESS_MAX_CONCURRENT: ${API_ACCESS_MAX_CONCURRENT:-2}
      WORKSPACE_PREDICTION_MAX_CONCURRENT: ${WORKSPACE_PREDICTION_MAX_CONCURRENT:-4}
      RUNTIME_QUEUE_MAX_WAITING: ${RUNTIME_QUEUE_MAX_WAITING:-1000}
      RUNTIME_QUEUE_MAX_PER_CALLER: ${RUNTIME_QUEUE_MAX_PER_CALLER:-16}
      RUNTIME_QUEUE_MAX_WAIT_MS: ${RUNTIME_QUEUE_MAX_WAIT_MS:-5000}
      PREDICTION_JOBS_MAX_ROWS: ${PREDICTION_JOBS_MAX_ROWS:-10000}
      PREDICTION_JOBS_MAX_OPEN_PER_MEMBER: ${PREDICTION_JOBS_MAX_OPEN_PER_MEMBER:-2}
      PREDICTION_JOBS_MAX_OPEN_PER_ORGANIZATION: ${PREDICTION_JOBS_MAX_OPEN_PER_ORGANIZATION:-4}
      API_ACCESS_REQUESTS_PER_MINUTE: ${API_ACCESS_REQUESTS_PER_MINUTE:-60}
      API_ACCESS_MONTHLY_CALLS: ${API_ACCESS_MONTHLY_CALLS:-10000}
      API_ACCESS_REQUEST_RETENTION_DAYS: ${API_ACCESS_REQUEST_RETENTION_DAYS:-90}
      NOTIFICATIONS_RETENTION_DAYS: ${NOTIFICATIONS_RETENTION_DAYS:-30}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-7}
      ALERTS_EVALUATE_SECONDS: ${ALERTS_EVALUATE_SECONDS:-15}
      ALERTS_SUSTAIN_SECONDS: ${ALERTS_SUSTAIN_SECONDS:-120}
      ALERTS_CLEAR_SECONDS: ${ALERTS_CLEAR_SECONDS:-300}
      ALERTS_RETENTION_DAYS: ${ALERTS_RETENTION_DAYS:-30}
      ALERTS_PREDICTION_ROWS_WARNING: ${ALERTS_PREDICTION_ROWS_WARNING:-20000}
      ALERTS_PREDICTION_ROWS_CRITICAL: ${ALERTS_PREDICTION_ROWS_CRITICAL:-100000}
      ALERTS_PREDICTION_ROWS_CLEAR: ${ALERTS_PREDICTION_ROWS_CLEAR:-10000}
      ALERTS_PREDICTION_AGE_SECONDS_WARNING: ${ALERTS_PREDICTION_AGE_SECONDS_WARNING:-900}
      ALERTS_PREDICTION_AGE_SECONDS_CRITICAL: ${ALERTS_PREDICTION_AGE_SECONDS_CRITICAL:-3600}
      ALERTS_PREDICTION_AGE_SECONDS_CLEAR: ${ALERTS_PREDICTION_AGE_SECONDS_CLEAR:-300}
      ALERTS_MODELS_PREPARING_WARNING: ${ALERTS_MODELS_PREPARING_WARNING:-10}
      ALERTS_MODELS_PREPARING_CRITICAL: ${ALERTS_MODELS_PREPARING_CRITICAL:-50}
      ALERTS_MODELS_PREPARING_CLEAR: ${ALERTS_MODELS_PREPARING_CLEAR:-3}
      ALERTS_RUNTIME_QUEUE_WARNING: ${ALERTS_RUNTIME_QUEUE_WARNING:-100}
      ALERTS_RUNTIME_QUEUE_CRITICAL: ${ALERTS_RUNTIME_QUEUE_CRITICAL:-500}
      ALERTS_RUNTIME_QUEUE_CLEAR: ${ALERTS_RUNTIME_QUEUE_CLEAR:-20}
      ALERTS_RUNTIME_REJECTIONS_PER_MINUTE_WARNING: ${ALERTS_RUNTIME_REJECTIONS_PER_MINUTE_WARNING:-10}
      ALERTS_RUNTIME_REJECTIONS_PER_MINUTE_CRITICAL: ${ALERTS_RUNTIME_REJECTIONS_PER_MINUTE_CRITICAL:-120}
      ALERTS_RUNTIME_REJECTIONS_PER_MINUTE_CLEAR: ${ALERTS_RUNTIME_REJECTIONS_PER_MINUTE_CLEAR:-1}
      ALERTS_STORAGE_DELETIONS_FAILED_WARNING: ${ALERTS_STORAGE_DELETIONS_FAILED_WARNING:-1}
      ALERTS_STORAGE_DELETIONS_FAILED_CRITICAL: ${ALERTS_STORAGE_DELETIONS_FAILED_CRITICAL:-50}
      ALERTS_STORAGE_DELETIONS_FAILED_CLEAR: ${ALERTS_STORAGE_DELETIONS_FAILED_CLEAR:-1}
      ALERTS_CPU_PERCENT_WARNING: ${ALERTS_CPU_PERCENT_WARNING:-85}
      ALERTS_CPU_PERCENT_CRITICAL: ${ALERTS_CPU_PERCENT_CRITICAL:-95}
      ALERTS_CPU_PERCENT_CLEAR: ${ALERTS_CPU_PERCENT_CLEAR:-70}
      ALERTS_RAM_PERCENT_WARNING: ${ALERTS_RAM_PERCENT_WARNING:-85}
      ALERTS_RAM_PERCENT_CRITICAL: ${ALERTS_RAM_PERCENT_CRITICAL:-95}
      ALERTS_RAM_PERCENT_CLEAR: ${ALERTS_RAM_PERCENT_CLEAR:-70}
      ALERTS_DISK_PERCENT_WARNING: ${ALERTS_DISK_PERCENT_WARNING:-85}
      ALERTS_DISK_PERCENT_CRITICAL: ${ALERTS_DISK_PERCENT_CRITICAL:-95}
      ALERTS_DISK_PERCENT_CLEAR: ${ALERTS_DISK_PERCENT_CLEAR:-80}
      AUTH_MAX_LOGIN_FAILURES: ${AUTH_MAX_LOGIN_FAILURES:-10}
      AUTH_MAX_REGISTRATIONS: ${AUTH_MAX_REGISTRATIONS:-5}
      MLSUITE_SUPERADMIN_EMAIL: ${MLSUITE_SUPERADMIN_EMAIL}
      MLSUITE_SUPERADMIN_PASSWORD: ${MLSUITE_SUPERADMIN_PASSWORD}
      MLSUITE_SUPERADMIN_FULL_NAME: ${MLSUITE_SUPERADMIN_FULL_NAME}
      MLSUITE_SUPERADMIN_USERNAME: ${MLSUITE_SUPERADMIN_USERNAME}
      OPS_AGENT_BASE_URL: ${OPS_AGENT_BASE_URL}
      OPS_AGENT_SHARED_SECRET: ${OPS_AGENT_SHARED_SECRET}
    depends_on:
      ops-agent:
        condition: service_started
      postgres:
        condition: service_healthy
      py-analyzer:
        condition: service_healthy
      runtime-builder:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:${SPRING_PORT}/actuator/health/readiness >/dev/null" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [ edge, data, runtime, build ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging: *logging

  frontend:
    ports:
      - ${WEB_PORT}:5173
    # Starts before spring-app so the boot screen can report startup progress.
    depends_on:
      ops-agent:
        condition: service_started
    networks: [ edge ]
    restart: unless-stopped
    logging: *logging
